# What `cargo about generate` (just licenses) accepts from the crates Adroit
# is built from. A crate under any other licence fails the generation, so a
# new licence is a decision made here rather than one that slips in.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    # nvim-rs, which drives the embedded Neovim. It is linked into the
    # executable, which LGPL allows when the user can relink it with a
    # changed copy: Adroit's whole source is published, so they can.
    "LGPL-3.0",
]
workarounds = ["ring"]
# The platforms the flake and the release build for, whichever one
# generates the file, so it comes out the same everywhere.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Neither is in what a release ships.
ignore-dev-dependencies = true
ignore-build-dependencies = true
