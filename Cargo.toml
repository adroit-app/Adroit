[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# A placeholder: the tag is the only record of the version, and the release
# workflow stamps it here before building and publishing.
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lambdalisue/adroit"

[workspace.dependencies]
adroit-model = { path = "crates/model", version = "0.0.0" }
adroit-term = { path = "crates/term", version = "0.0.0" }
adroit-nvim = { path = "crates/nvim", version = "0.0.0" }
adroit-claude = { path = "crates/claude", version = "0.0.0" }

felis-vt = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
felis-grid = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
felis-protocol = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
felis-daemon = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
felis-transport = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
felis-client-core = { git = "https://github.com/felis-terminal/felis", rev = "6ee73ba9f3db5b0febfef89e6b1d23e102b573d4" }
base64 = "0.23.1"
core-foundation = "0.10.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2.190"
png = "0.18.1"
async-trait = "0.1.92"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
rmpv = "1.3.1"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
resvg = { version = "0.48.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "PDFDocument", "PDFPage"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "io-std", "net"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
schemars = { version = "1.2.3", features = ["uuid1"] }
shell-words = "1.1.1"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"
tempfile = "3.27.0"
uuid = { version = "1.28.0", features = ["v4"] }
