[package]
name = "adroit"
description = "A workspace where you work with many Claude Code sessions by hand: the Claude TUI as it is, prompts in your own Neovim, Vim-style moves."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:adroit-window"]

[dependencies]
adroit-agents.workspace = true
adroit-host.workspace = true
adroit-window = { workspace = true, optional = true }

[dev-dependencies]
adroit-model.workspace = true
adroit-term.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
