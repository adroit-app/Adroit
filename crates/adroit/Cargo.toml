[package]
name = "adroit"
description = "A workspace where you work with many Claude Code sessions by hand: the Claude TUI as it is, prompts in your own Neovim, Vim-style moves."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adroit-agents.workspace = true
adroit-core.workspace = true
adroit-model.workspace = true
adroit-nvim.workspace = true
adroit-runtime.workspace = true
adroit-term.workspace = true
adroit-vcs.workspace = true
dioxus = { version = "0.7.10", features = ["desktop"] }
image.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-pdf-kit.workspace = true

[dev-dependencies]
adroit-model = { workspace = true, features = ["testing"] }
tempfile.workspace = true
ttf-parser = "0.25.1"
wuff = "0.2.9"
