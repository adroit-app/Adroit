[package]
name = "adroit"
description = "A workspace where you work with many Claude Code sessions by hand: the Claude TUI as it is, prompts in your own Neovim, Vim-style moves."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adroit-claude.workspace = true
adroit-model.workspace = true
adroit-nvim.workspace = true
adroit-term.workspace = true
base64.workspace = true
dioxus = { version = "0.7.10", features = ["desktop"] }
image.workspace = true
libc.workspace = true
nucleo-matcher.workspace = true
regex.workspace = true
resvg.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
shell-words.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-pdf-kit.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
ttf-parser = "0.25.1"
