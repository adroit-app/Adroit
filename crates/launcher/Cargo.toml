[package]
name = "adroit-launcher"
description = "adroitw, which opens Adroit's window as adroit does, without the console Windows gives a console program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "adroitw"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
adroit-sys.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
