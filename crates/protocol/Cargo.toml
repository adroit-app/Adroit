[package]
name = "adroit-protocol"
description = "What the window and the work host say to each other: requests, events, the work they describe, and the versions they speak"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
adroit-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
adroit-model = { workspace = true, features = ["testing"] }

[features]
# The asking side of the work host's socket.
client = ["dep:tokio"]
# Builders for the host's words tests feed a window, for other crates' tests.
testing = ["adroit-model/testing"]
