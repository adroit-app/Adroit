[package]
name = "adroit-host"
description = "The adroit work host: the work it owns, the sessions and shells it starts in the terminal host, delegation, and the CLI that asks it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
adroit-agents.workspace = true
adroit-core.workspace = true
adroit-model.workspace = true
adroit-nvim.workspace = true
adroit-protocol = { workspace = true, features = ["client"] }
adroit-term.workspace = true
adroit-vcs.workspace = true
base64.workspace = true
image.workspace = true
libc.workspace = true
resvg.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[dev-dependencies]
adroit-model = { workspace = true, features = ["testing"] }
adroit-protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
wuff = "0.2.9"
